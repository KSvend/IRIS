name: Pipeline Health Check

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check recent monitor runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Monitor Run Health Check ==="
          echo "Checking runs from the past 7 days..."

          RUNS=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow "MERLx IRIS Monitor" \
            --created ">$(date -d '7 days ago' -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -v-7d -u +%Y-%m-%dT%H:%M:%SZ)" \
            --json conclusion,createdAt \
            --limit 20)

          TOTAL=$(echo "$RUNS" | jq 'length')
          SUCCESS=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "success")] | length')
          FAILED=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "failure")] | length')

          echo "Total runs: $TOTAL"
          echo "Successful: $SUCCESS"
          echo "Failed: $FAILED"

          if [ "$TOTAL" -lt 10 ]; then
            echo "::warning::Low run count: only $TOTAL runs in past 7 days (expected ~14)"
          fi

          if [ "$FAILED" -gt 2 ]; then
            echo "::error::High failure rate: $FAILED failed runs in past 7 days"
            exit 1
          fi

          echo "Pipeline health: OK ($SUCCESS/$TOTAL successful)"
      - name: Report to Healthchecks.io
        # ops-monitor heartbeat (KSvend/ops-monitor). Runs even when an earlier
        # step failed, so failures and missed runs both reach Healthchecks.io;
        # it never fails the job itself.
        if: always()
        env:
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$HC_PING_KEY" ]; then
            echo "::warning::HC_PING_KEY is not set; no heartbeat sent"
            exit 0
          fi
          code=1
          if [ "$JOB_STATUS" = "success" ]; then code=0; fi
          curl -fsS -m 10 --retry 5 -o /dev/null \
            "https://hc-ping.com/${HC_PING_KEY}/iris-monitor-health/${code}" \
            || echo "::warning::heartbeat to Healthchecks.io was not delivered"
